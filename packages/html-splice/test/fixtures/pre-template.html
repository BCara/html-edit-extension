<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Pre, template, textarea &amp; noscript</title></head>
<body>
<p>Paragraph before the pre.</p>
<pre>
first line of preformatted text
  indented second line
last line</pre>
<pre>no leading newline here</pre>
<textarea rows="3">
Textarea content with an entity &amp; a newline
</textarea>
<template id="row">
  <tr><td class="name">Template text is not editable</td></tr>
</template>
<noscript>
  <p>Noscript content is raw text when scripting is on.</p>
</noscript>
<p>Paragraph after everything.</p>
</body>
</html>
