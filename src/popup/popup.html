<!doctype html>
<meta charset="utf-8">
<title>Quick Edit</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <h1>Quick Edit</h1>

  <div id="state" class="state">Checking this tab…</div>

  <div id="actions" class="actions" hidden>
    <button id="toggle" class="primary"></button>
    <button id="save" hidden>Save</button>
  </div>

  <div id="fileaccess" class="actions" hidden>
    <button id="open-extensions">Open extension settings</button>
  </div>

  <div id="grant" class="grant" hidden>
    <div class="actions">
      <button id="grant-btn" class="primary">Allow direct file access</button>
      <button id="skip-btn">Choose it myself</button>
    </div>
    <p id="grant-note">Chrome will ask you to confirm. Without it, Quick Edit
       has to ask you to pick the file every time you open one.</p>
  </div>

  <details id="detail" hidden>
    <summary>What Quick Edit found</summary>
    <div id="detail-body"></div>
  </details>

  <p class="foot" id="foot"></p>
</div>
<script src="popup.js"></script>
